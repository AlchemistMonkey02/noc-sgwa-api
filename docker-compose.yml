version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      # Using 'host.docker.internal' to access Mongo on host machine if not running in container
      # Or assume user sets MONGODB_URI in their .env
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - uploads:/usr/src/app/uploads # Persist uploads outside container
    command: npm start
    restart: unless-stopped

volumes:
  uploads: # Named volume for persistent file storage
